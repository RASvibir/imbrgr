services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imbrgr
      POSTGRES_PASSWORD: imbrgr
      POSTGRES_DB: imbrgr
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imbrgr"]
      interval: 3s
      timeout: 5s
      retries: 10
